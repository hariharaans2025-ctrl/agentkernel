[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkernel"
version = "0.1.0"
description = "Adaptive inference runtime with an execution-verified C/pthreads concurrency debugging application"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "contree-sdk==0.3.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agentkernel = "agentkernel.cli:main"
agentkernel-dashboard = "agentkernel.dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentkernel.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not nebius and not langsmith and not gpu'"
markers = ["integration: requires a real compiler or external runtime", "nebius: opt-in real Nebius account (may spend credits)", "langsmith: opt-in live LangSmith account", "gpu: requires a real local GPU backend"]
